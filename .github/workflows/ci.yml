name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }} on Windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and development dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Run Ruff
        run: |
          python -m ruff format --check .
          python -m ruff check .

      - name: Run BasedPyright
        run: python -m basedpyright

      - name: Probe extra import smoke test
        run: |
          python -m pip install --disable-pip-version-check -e ".[probe]"
          python -c "import sounddevice; print(sounddevice.__version__)"
